[[repos]]
repo = "builtin"
hooks = [
	{ id = "fix-byte-order-marker" },
	{ id = "trailing-whitespace" },
	{ id = "end-of-file-fixer" },
	{ id = "check-added-large-files" },
	{ id = "check-case-conflict" },
	{ id = "check-illegal-windows-names" },
	{ id = "check-toml" },
	{ id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
	{
		id = "mage-fmt",
		name = "format go",
		entry = "mage fmt",
		language = "system",
		types = ["go"],
		pass_filenames = false,
	},
	{
		id = "mage-test",
		name = "test go",
		entry = "mage test",
		language = "system",
		types = ["go"],
		pass_filenames = false,
	},
]
